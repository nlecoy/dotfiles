format = """
$username\
[ at ](overlay1)\
$hostname\
[ in ](overlay1)\
$directory\
$git_branch\
$c\
$cpp\
$golang\
$java\
$nodejs\
$python\
$ruby\
$rust\
$line_break\
$character
"""

right_format = "$kubernetes$cmd_duration$time"

add_newline = false
palette = "catppuccin_macchiato"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"
vimcmd_replace_one_symbol = "[❮](bold peach)"
vimcmd_replace_symbol = "[❮](bold red)"
vimcmd_visual_symbol = "[❮](bold mauve)"

[username]
format = "[$user]($style)"
show_always = true
style_root = "bold red"
style_user = "bold green"

[hostname]
format = "[$hostname]($style)"
ssh_only = false
style = "bold blue"

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red"
repo_root_style = "bold teal"
style = "bold peach"
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on git:](overlay1)[$branch]($style)"
style = "bold mauve"

[c]
format = " [via C( $version)]($style)"
style = "blue"

[cpp]
format = " [via C++( $version)]($style)"
style = "blue"

[python]
format = " [via Python( $version)]($style)"
style = "yellow"

[golang]
format = " [via Go( $version)]($style)"
style = "sky"

[java]
format = " [via Java( $version)]($style)"
style = "red"

[nodejs]
format = " [via Node.js( $version)]($style)"
style = "green"

[ruby]
format = " [via Ruby( $version)]($style)"
style = "red"

[rust]
format = " [via Rust( $version)]($style)"
style = "peach"

[kubernetes]
disabled = false
format = '[$symbol$context]($style)[/$namespace](fg:overlay1)  '
style = "bold blue"
symbol = "󱃾 "

[cmd_duration]
format = "[󰔛 $duration]($style)  "
min_time = 2_000
show_milliseconds = false
style = "yellow"

[time]
disabled = false
format = "[ $time]($style)"
style = "overlay1"
time_format = "%H:%M"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
